[workspace]
resolver = "2"
members = [
    "indicators/cvd",
    "indicators/flow",
    "examples/range",
    "conformance",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
# One public SDK authority, pinned for independently reproducible builds.
cvd-indicator-sdk = { git = "https://github.com/k0Iry/cvd-core.git", rev = "81e77770902b7e760c66905eec473d66fb6e2fe3" }
serde_json = "1.0"

[profile.release]
# The SDK catches panics at the C ABI boundary; unwinding must stay enabled.
panic = "unwind"
