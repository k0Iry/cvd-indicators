[workspace]
resolver = "2"
members = [
    "indicators/cvd",
    "indicators/cvd-anchored",
    "indicators/flow",
    "indicators/orderbook",
    "examples/range",
    "conformance",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "Apache-2.0"
rust-version = "1.96"

[workspace.dependencies]
# One public SDK authority, pinned for independently reproducible builds.
cvd-indicator-sdk = { git = "https://github.com/k0Iry/cvd-core.git", rev = "c3383ed94e62dc5df8bfed7b08bd79949b7cb808" }
serde_json = "1.0"

[profile.release]
# Native builds are used by the Rust test oracle.
panic = "unwind"

# Browser plugin artifacts: `cargo build --profile wasm-release --target wasm32-unknown-unknown`.
# A wasm trap is fatal to the plugin Worker, so panics abort.
[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
